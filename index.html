<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trauma-Informed Workforce Wellness — A Field Guide</title>
<style>
  :root{
    --teal:#00A9A7;
    --teal-text:#006564;
    --blue:#00A4E4;
    --deep:#0069AA;
    --dark:#00253B;
    --dark2:#001725;
    --paper:#FFFFFF;
    --paper-2:#E4F0EF;
    --ink:#1B2A2E;
    --ink-soft:#54666B;
    --gold:#0069AA;
    --sage:#8FC9C6;
    --wash-1:#EEF7F7;
    --wash-2:#DCEEED;
    --card-shadow: 0 14px 32px -16px rgba(0,37,59,.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background: radial-gradient(1200px 800px at 15% -10%, var(--wash-1) 0%, var(--wash-2) 55%, #CFE6E4 100%);
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    color: var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding: 24px 12px 12px;
  }
  .label{
    font-family: 'Courier New', Courier, monospace;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:11px;
  }
  .frame{
    width:100%;
    max-width:460px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .masthead{
    color:var(--ink-soft);
    text-align:center;
    margin-bottom:14px;
  }
  .masthead .label{color:var(--teal-text); font-weight:600;}
  .masthead-logo{
    width:56px;
    height:auto;
    margin-bottom:4px;
  }
  .masthead h1{
    font-size:15px;
    margin:4px 0 0;
    font-weight:600;
    letter-spacing:.03em;
    color:var(--ink);
  }
  .listen-link{
    display:inline-block;
    margin-top:9px;
    font-family:'Courier New', monospace;
    font-size:10px;
    letter-spacing:.06em;
    color:var(--teal-text);
    text-decoration:underline;
    background:#fff;
    border:1px solid var(--teal);
    border-radius:14px;
    padding:5px 12px;
    transition: background .2s ease;
  }
  .listen-link:hover{ background: var(--wash-1); }
  .listen-link:focus-visible{ outline:2px solid var(--deep); outline-offset:2px; }
  .back-to-guide-btn{
    display:inline-block;
    font-family:'Courier New', monospace;
    font-size:11px;
    font-weight:bold;
    letter-spacing:.05em;
    color:#fff;
    background:var(--deep);
    text-decoration:none;
    border-radius:20px;
    padding:9px 18px;
    box-shadow:0 4px 10px -4px rgba(0,37,59,.4);
  }
  .back-to-guide-btn:hover{ background:var(--dark); }
  .back-to-guide-btn:focus-visible{ outline:2px solid var(--teal-text); outline-offset:2px; }
  .masthead-links{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-top:9px;
  }
  .masthead-links .listen-link{ margin-top:0; }
  .masthead-links .listen-link.return-link{
    background:var(--deep);
    color:#fff;
    border-color:var(--deep);
    text-decoration:none;
    font-weight:700;
    padding:8px 16px;
    box-shadow:0 4px 10px -4px rgba(0,37,59,.4);
  }
  .masthead-links .listen-link.return-link:hover{ background:var(--dark); }
  .page-ornament{
    position:absolute;
    bottom:8px;
    right:8px;
    width:44px;
    height:44px;
    opacity:.16;
    pointer-events:none;
  }
  .notebox{
    margin-top:10px;
    padding-top:8px;
    border-top:1px dashed var(--sage);
  }
  .notebox label{
    display:block;
    font-family:'Courier New', monospace;
    font-size:9px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color: var(--teal-text);
    margin-bottom:4px;
  }
  .notebox-hint{
    text-transform:none;
    color:var(--ink-soft);
    font-style:italic;
    letter-spacing:0;
  }
  .notebox textarea{
    width:100%;
    resize:vertical;
    font-family:Georgia, serif;
    font-size:11px;
    color:var(--ink);
    background:#fff;
    border:1px solid var(--sage);
    border-radius:6px;
    padding:6px 8px;
    box-sizing:border-box;
  }
  .notebox textarea:focus-visible{ outline:2px solid var(--deep); outline-offset:1px; }

  .author-intro{
    display:flex;
    align-items:center;
    gap:10px;
    margin:0 0 8px;
    padding:7px 9px;
    background:var(--wash-1);
    border-left:3px solid var(--teal);
    border-radius:4px 7px 7px 4px;
  }
  .author-intro img{
    width:48px !important;
    height:48px !important;
  }
  .page2-wayfinding{
    margin:0 0 8px;
    font-size:11.5px;
    line-height:1.35;
    color:var(--ink-soft);
    font-style:italic;
  }
  .pullquote{
    margin:14px 0;
    padding:10px 0 10px 14px;
    border-left:3px solid var(--teal);
  }
  .pullquote p{
    font-family:Georgia, serif;
    font-style:italic;
    font-size:13px;
    line-height:1.45;
    color:var(--deep);
    margin:0 0 4px;
  }
  .pullquote cite{
    font-family:'Courier New', monospace;
    font-style:normal;
    font-size:9.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .book{
    position:relative;
    width:100%;
    aspect-ratio: 5 / 7.2;
    perspective: 1800px;
  }
  .spine{
    position:absolute;
    left:-6px; top:10px; bottom:10px;
    width:14px;
    background: repeating-linear-gradient(180deg, var(--teal) 0 3px, var(--blue) 3px 6px, transparent 6px 13px);
    opacity:.85;
    border-radius:6px;
    z-index:3;
  }
  .page{
    position:absolute;
    inset:0;
    background: var(--paper);
    border-radius: 3px 10px 10px 3px;
    box-shadow: var(--card-shadow);
    padding: 30px 26px 26px;
    overflow:hidden;
    transform-origin: left center;
    transition: transform .55s cubic-bezier(.4,.05,.2,1), opacity .5s ease;
    display:flex;
    flex-direction:column;
    background-image:
      linear-gradient(90deg, rgba(31,74,66,.06) 0 2px, transparent 2px),
      radial-gradient(circle at 100% 0%, rgba(31,74,66,.05), transparent 55%);
    background-repeat: no-repeat, no-repeat;
  }
  .page::after{
    content:"";
    position:absolute;
    right:0; top:0; bottom:0;
    width:26px;
    background: linear-gradient(90deg, transparent, rgba(21,54,48,.08));
    pointer-events:none;
  }
  .page.current{ transform: rotateY(0deg); opacity:1; z-index:2; }
  .page.next{ transform: rotateY(-92deg); opacity:0; z-index:1; }
  .page.prev{ transform: rotateY(92deg); opacity:0; z-index:1; }

  .pg-eyebrow{
    font-family:'Courier New', monospace;
    font-size:10.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color: var(--teal-text);
    font-weight:600;
    margin-bottom:6px;
  }
  .pg-title{
    font-size: 20px;
    line-height:1.15;
    color: var(--deep);
    margin: 0 0 10px;
    font-weight:700;
  }
  .pg-sub{
    font-size:12.5px;
    color: var(--ink-soft);
    font-style:italic;
    margin: 0 0 12px;
    line-height:1.4;
  }
  .pg-body{
    font-size:12.5px;
    line-height:1.55;
    overflow-y:auto;
    flex:1;
    padding-right:2px;
  }
  .pg-body::-webkit-scrollbar{width:5px;}
  .pg-body::-webkit-scrollbar-thumb{background:var(--sage);border-radius:4px;}
  .pg-body p{ margin: 0 0 10px; }
  .term{
    font-family:'Courier New', monospace;
    font-size:11.5px;
    letter-spacing:.08em;
    color:var(--deep);
    font-weight:700;
    margin:14px 0 3px;
  }
  .term:first-child{margin-top:0;}
  .quote{
    background: var(--paper-2);
    border-left: 3px solid var(--teal);
    border-radius: 2px 6px 6px 2px;
    padding: 9px 11px;
    margin: 0 0 9px;
    font-size:11.5px;
    line-height:1.4;
    font-style:italic;
  }
  .quote cite{
    display:block;
    margin-top:5px;
    font-family:'Courier New', monospace;
    font-style:normal;
    font-size:9.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .stepline{
    display:flex;
    gap:8px;
    margin:0 0 9px;
    align-items:flex-start;
  }
  .stepline .tag{
    flex:0 0 auto;
    font-family:'Courier New', monospace;
    font-size:9.5px;
    color:#fff;
    background:var(--deep);
    padding:2px 6px;
    border-radius:3px;
    white-space:nowrap;
    margin-top:1px;
  }
  .letterband{
    display:flex;
    gap:10px;
    align-items:center;
    margin: 2px 0 10px;
  }
  .letterband .L{
    font-family:'Courier New', monospace;
    font-weight:700;
    font-size:22px;
    color:var(--deep);
    background:var(--paper-2);
    width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;
    border-radius:6px;
    flex:0 0 auto;
  }
  .letterband .txt{font-size:11.5px; line-height:1.35; color:var(--ink-soft);}
  .practice{
    margin:0 0 9px;
    font-size:11.5px;
    line-height:1.4;
  }
  .practice b{color:var(--deep);}
  ul.plain{margin:0 0 8px; padding-left:16px;}
  ul.plain li{margin-bottom:6px; font-size:12px; line-height:1.45;}
  .fieldtable{
    width:100%;
    border-collapse:collapse;
    font-size:10.5px;
    margin: 6px 0 10px;
  }
  .fieldtable th, .fieldtable td{
    border:1px solid var(--sage);
    padding:5px 6px;
    text-align:left;
    vertical-align:top;
  }
  .fieldtable th{
    background: var(--deep);
    color:#fff;
    font-family:'Courier New', monospace;
    font-size:9px;
    letter-spacing:.05em;
    text-transform:uppercase;
    font-weight:600;
  }
  .callout{
    background: var(--deep);
    color:#F3F0E4;
    border-radius:6px;
    padding:10px 12px;
    font-size:11px;
    line-height:1.4;
    margin: 6px 0 10px;
  }
  .callout b{color:#EAD8AE;}
  .cover{
    align-items:center;
    text-align:center;
    justify-content:center;
    background:
      radial-gradient(circle at 50% 10%, rgba(0,169,167,.16), transparent 55%),
      linear-gradient(160deg, #FFFFFF 0%, var(--wash-1) 55%, var(--wash-2) 100%);
    color:var(--ink);
  }
  .cover .kicker{
    font-family:'Courier New', monospace;
    letter-spacing:.22em;
    font-size:11px;
    color:var(--teal-text);
    font-weight:600;
    margin-bottom:18px;
  }
  .cover h1{
    font-size:27px;
    line-height:1.2;
    margin:0 0 8px;
    font-weight:700;
    color:var(--deep);
  }
  .cover h2{
    font-size:15px;
    font-weight:400;
    font-style:italic;
    margin:0 0 26px;
    color:var(--ink-soft);
  }
  .cover .foot{
    font-family:'Courier New', monospace;
    font-size:10px;
    color:var(--teal-text);
    letter-spacing:.08em;
  }
  .pgnum{
    position:absolute;
    bottom:10px; right:16px;
    font-family:'Courier New', monospace;
    font-size:9.5px;
    color: var(--ink-soft);
    opacity:.7;
  }
  .final .pg-body{display:flex; flex-direction:column; justify-content:space-between;}
  .scroll-fade{
    position:absolute;
    left:0; right:0; bottom:0;
    height:34px;
    background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.94) 75%);
    pointer-events:none;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:3px;
    opacity:0;
    transition:opacity .25s ease;
  }
  .scroll-fade.visible{ opacity:1; }
  .scroll-fade .chev{
    font-family:'Courier New', monospace;
    font-size:12px;
    color:var(--teal-text);
    animation: bob 1.4s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(3px); }
  }

  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    max-width:460px;
    margin-top:16px;
    gap:10px;
  }
  button{
    font-family:'Courier New', monospace;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    background: #FFFFFF;
    color:var(--deep);
    border:1px solid var(--sage);
    border-radius:20px;
    padding:9px 16px;
    cursor:pointer;
    transition: background .2s ease;
  }
  button:hover{ background: var(--wash-1); }
  button:disabled{opacity:.4; cursor:default;}
  button:focus-visible{ outline:2px solid var(--deep); outline-offset:2px; }
  .progress{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
  }
  .progress .track{
    width:100%;
    height:4px;
    background:#D7E7E6;
    border-radius:3px;
    overflow:hidden;
  }
  .progress .fill{
    height:100%;
    background: var(--deep);
    transition: width .4s ease;
  }
  .progress .count{
    font-family:'Courier New', monospace;
    font-size:10px;
    color:var(--ink-soft);
    letter-spacing:.08em;
  }
  .hint{
    color:var(--ink-soft);
    font-family:'Courier New', monospace;
    font-size:9.5px;
    letter-spacing:.06em;
    margin-top:10px;
    text-align:center;
  }
  @media (max-width:380px){
    .pg-title{font-size:18px;}
    .cover h1{font-size:23px;}
  }
</style>
</head>

<div class="frame">
  <div class="masthead">
    <img id="mastheadLogo" alt="Trauma Informed Oregon logo" class="masthead-logo">

    <button id="nextBtn" onclick="handleNext()">Next ›</button>
  </div>
  <div class="hint">swipe, tap the edges, or use arrow keys to turn pages</div>
</div>

      <p style="margin:0;"><a href="https://traumainformedoregon.org/about/staff/" target="_blank" rel="noopener" style="color:var(--deep);text-decoration:underline;font-weight:bold;">Steffannie Roach\u00e9, MS, LPC, LMHC</a><br><span style="font-size:11px;color:var(--ink-soft);">Assistant Professor of Practice, Trauma Informed Oregon<br>Portland State University &middot; <a href="https://traumainformedoregon.org/about/staff/" target="_blank" rel="noopener" style="color:var(--teal-text);">full bio →</a></span></p>
    </div>
  <div class="pg-body">
    <p>Thank you for being in the room this year.</p>
    <p>Ninety-one people filled out a survey after these sessions. I read every response. Some of them I have not been able to put down.</p>
    <p>You told me about funding pulled out from under programs, about layoffs and then double the work for whoever stayed, about immigration enforcement reaching your staff and the fear that followed them home, about administrators who would not say what was happening, and about teams that stopped trusting the silence. You told me you were still showing up anyway.</p>
    <p>This booklet is not a training. There is no test in it and nothing to turn in. It holds the parts of the year worth keeping: what people said, the words that make the experience easier to name, a few practices that fit inside a real working day, and two things you can bring back to your team.</p>
    <p>The word people used most often about these sessions was <i>validating</i>. Something in a room where the conditions get named accurately, with other people nodding, does work that no amount of reading does. This booklet is an attempt to keep some of that available after the room closes.</p>
    <p>Use what helps. Skip what does not. Choosing your own participation is a trauma informed practice, and it applies to paper the same way it applies to rooms.</p>
    
  </div>
`);

// 6 — Words for what is happening (Toxic Stress, Vicarious Trauma)
addPage(`
  <div class="pg-eyebrow">Field terms &middot; 1 of 2</div>
  <div class="pg-title">Words for what is happening</div>
  <div class="pg-sub">Having accurate language changes what you can ask for. These four terms come up constantly in this work, and they are not interchangeable.</div>
  <div class="pg-body">
    <div class="term">TOXIC STRESS</div>
    <p>Stress that stays switched on. The body responds to a threat, then does not get recovery time before the next one arrives. Over months it shows up as sleep trouble, irritability, physical symptoms, and trouble concentrating.</p>
    <div class="term">VICARIOUS TRAUMA</div>
    <p>The cumulative effect of repeated exposure to other people's trauma. It is what accumulates in people who listen to hard stories as part of the job. Not weakness, and not a sign you chose wrong. It is the predictable cost of the work when there is no structure holding it.</p>
  </div>
`);

// 7 — Words for what is happening (Moral Injury, Institutional Betrayal)
addPage(`
  <div class="pg-eyebrow">Field terms &middot; 2 of 2</div>
  <div class="pg-title">Words for what is happening</div>
  <div class="pg-body">
    <div class="term">MORAL INJURY</div>
    <p>Distress from being unable to act in line with your own values, or from being let down by an institution you trusted. Burnout is about depletion. Moral injury is about being asked to do something you believe is wrong, or being blocked from doing what you know is right.</p>
    <div class="term">INSTITUTIONAL BETRAYAL</div>
    <p>What happens when an organization people depended on fails to protect them, or hides what it is doing. It is a specific harm, and encouraging people to be more resilient does not touch it.</p>
    <div class="callout"><b>Why the difference matters.</b> Burnout responds to rest and to workload change. Moral injury responds to truth-telling, repair, and changes in how decisions get made. Reaching for a rest strategy when the problem is moral injury is why so many wellness efforts land flat.</div>
    <div class="pullquote">
      <p>"Not everything that is faced can be changed, but nothing can be changed until it is faced."</p>
      <cite>James Baldwin, "As Much Truth as One Can Bear," 1962</cite>
    </div>
  </div>
`);

// 8 — The Cool-Ah
addPage(`
  <div class="pg-eyebrow">A solo practice</div>
  <div class="pg-title">The Cool-Ah</div>
  <div class="pg-sub">This one is mine, and it is the practice that is helpful during the workday or whenever you need it.</div>
  <div class="pg-body">
    <div class="practice"><b>The Cool</b> — somatic awareness (body-based noticing). At your own pace, gently breathe in through your nose in a way that lets the air feel cool or cold in your nostrils and the back of your throat. Then, when you are ready:</div>
    <div class="practice"><b>The Ah</b> — somatic awareness, warmth. At your own pace, gently make a silent, low, barely audible "ah" out of your mouth, in a way that lets the air feel warm on your mouth and tongue. Take a second to notice the warmth.</div>
    <p>The pattern is cool, warm, cool, warm. Moving your attention back and forth between the two sensations is what does the work. Noticing sensation inside the body like this (interoception) pulls attention out of threat-focused thinking and into the present moment, and the slow, extended exhale on the "ah" supports the body's calming response — which is why your breathing and heart rate tend to settle as you repeat it.</p>
    <p>Breathe normally between each Cool-Ah. Repeat a few times as needed.</p>
    <div class="callout">If you yawn or feel a little tired after a few rounds, that is the point. It means the stress response is settling.</div>
    <p style="font-size:10px;color:var(--ink-soft);margin-top:6px;">Steffannie Roaché, <i>The Cool-Ah,</i> 2012.</p>
  </div>
`);

// 9 — Three more that fit in a workday
addPage(`
  <div class="pg-eyebrow">Solo practices</div>
  <div class="pg-title">Three more that fit in a workday</div>
  <div class="pg-sub">These are regulation practices, not treatment. None takes longer than three minutes.</div>
  <div class="pg-body">
    <div class="term">ORIENTING</div>
    <p>Without moving your head much, let your eyes travel slowly around the room and land on five things. Name them silently. This tells the body it is looking at an office, not a threat.</p>
    <div class="term">FEET AND FLOOR</div>
    <p>Press both feet into the ground, hold five seconds, release. Three times. Available in any meeting without anyone noticing.</p>
    <div class="term">MOVEMENT BREAK</div>
    <p>Stand up and walk for three minutes with no phone. Stress chemistry is built for movement, and sitting through it keeps it circulating.</p>
    <p style="font-size:11px;color:var(--ink-soft);">If your honest answer is that none of this will touch what you are dealing with, take that seriously rather than pushing past it. An employee assistance program, your own therapist, a trusted colleague, a union representative, or your primary care provider are all reasonable next stops.</p>
    <div class="pullquote"><p>&ldquo;Use what helps. Skip what does not.&rdquo;</p></div>
  </div>
`);

// 10 — P.A.C.E. intro + P for Presence
addPage(`
  <div class="pg-eyebrow">A team practice &middot; introduction</div>
  <div class="pg-title">P.A.C.E.</div>
  <div class="pg-sub">This is a short introduction to P.A.C.E. Everything before this is something you do by yourself. P.A.C.E. is what a team does together, and it takes about five minutes at the top of a meeting.</div>
  <div class="pg-body">
    <p style="font-size:11px;">The order matters. Presence settles the body before anything is asked of it. Attune makes room for how people actually are without requiring anyone to explain themselves. Connect uses rhythm rather than personal content, because groups that move together regulate together. Energy names limits out loud, which is what makes the whole thing sustainable.</p>
    <p style="font-size:11px;"><b>Nothing in it requires disclosure.</b> That is deliberate. A team practice that depends on people sharing feelings will fail in exactly the workplaces that need it most.</p>
    <p style="font-size:10px;color:var(--ink-soft);">Steffannie Roaché, <i>P.A.C.E.,</i> 2024.</p>
    <div class="callout">Want the full P.A.C.E. training for your organization, with the complete instrument? Contact us at info@traumainformedoregon.org</div>

      <div class="txt"><b>Presence</b> — external orientation to the environment. When attention shifts outward, the threat system quiets.</div>

  </div>
`);

// 11 — A for Attune + C for Connect
addPage(`

// 16 — What belongs to the organization
addPage(`
  <div class="pg-eyebrow">The most important page</div>
  <div class="pg-title">What belongs to the organization</div>
  <div class="pg-sub">This is the most important page in the booklet, and it is the one to hand upward.</div>
  <div class="pg-body">
    <p style="font-size:11px;">Everything else in here is something you or your team can do without permission. None of it is a substitute for the work an organization owes its workforce. A trauma informed organization does not respond to staff distress by offering more coping strategies. It changes the conditions producing the distress.</p>
    <p style="font-size:11px;">These are organizational responsibilities. They cannot be met by an individual, and asking an individual to absorb them is itself a harm.</p>
    <ul class="plain">
      <li>Workload that one person can actually carry, reviewed when the team shrinks rather than left to redistribute itself.</li>
      <li>Staffing decisions communicated before staff hear them as rumor.</li>
      <li>Transparency about what is happening, what is not yet decided, and when people will know more.</li>
      <li>Time built into the schedule for recovery, supervision, and peer connection, rather than expected on personal time.</li>
      <li>Supervisors who are trained, supported, and given somewhere to take what they are holding.</li>
      <li>A way to raise a problem that does not cost the person who raises it.</li>
      <li>Repair when the organization gets something wrong: an accurate account, acknowledged impact, a specific change, and that change holding.</li>
      <li>Policies and procedures examined through a trauma lens, including hiring, evaluation, scheduling, and discipline.</li>
    </ul>
    <div class="callout"><b>A test worth applying to any wellness offer, including this one.</b> Does it ask the person carrying the most weight to carry more? If yes, it is not trauma informed, whatever it is called.</div>

`);

let current = 0;
const book = document.getElementById('book');
const els = [];

function rayOrnament(){
  // Small decorative sunburst echoing the TIO logo, fills empty corner space.
  let rays = '';
  for(let i=0;i<9;i++){
    const angle = -90 + i*11;
    const col = i % 2 === 0 ? 'var(--teal)' : 'var(--blue)';
    rays += `<line x1="40" y1="40" x2="${40+34*Math.cos(angle*Math.PI/180)}" y2="${40+34*Math.sin(angle*Math.PI/180)}" stroke="${col}" stroke-width="4" stroke-linecap="round"/>`;
  }
  return `<svg class="page-ornament" viewBox="0 0 80 80" aria-hidden="true">${rays}</svg>`;
}

function notesBox(i){
  return `<div class="notebox">
    <label for="note-${i}">Your notes on this page <span class="notebox-hint">— stays only in this browser tab</span></label>
    <textarea id="note-${i}" rows="2" placeholder="Jot a thought, a word, a plan..." oninput="notesStore[${i}] = this.value"></textarea>
  </div>`;
}

function render(){
  book.querySelectorAll('.page').forEach(e=>e.remove());
  pages.forEach((p, i)=>{
    const div = document.createElement('div');
    div.className = 'page ' + (p.cls||'');
    const isCover = (p.cls||'').includes('cover');
    const extras = isCover ? '' : (rayOrnament() + notesBox(i));
    div.innerHTML = p.inner + extras + `<div class="pgnum">${i+1} / ${pages.length}</div>`;
    if(!isCover){
      const fade = document.createElement('div');
      fade.className = 'scroll-fade';
      fade.innerHTML = '<span class="chev">⌄ more below</span>';
      div.appendChild(fade);
      const body = div.querySelector('.pg-body');
      if(body){
        const check = () => updateScrollFade(body, fade);
        body.addEventListener('scroll', check);
        // Re-check after layout settles (fonts/images loading can change scrollHeight)
        setTimeout(check, 60);
        setTimeout(check, 400);
      }
    }
    if(i === current) div.classList.add('current');
    else if(i < current) div.classList.add('prev');
    else div.classList.add('next');
    book.appendChild(div);
    els[i] = div;
  });
  updateControls();
}

function updateScrollFade(body, fade){
  const hasMore = body.scrollHeight - body.scrollTop - body.clientHeight > 8;
  fade.classList.toggle('visible', hasMore);
}

function updateControls(){
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const playlistNav = document.getElementById('playlistNav');
  const onPlaylist = current === pages.length - 1;

  prevBtn.disabled = current === 0;
  nextBtn.disabled = false;
  nextBtn.textContent = onPlaylist ? '↩ Back to Guide' : 'Next ›';

  if(playlistNav){
    playlistNav.textContent = onPlaylist
      ? '← BACK TO FIELD GUIDE'
      : "🎧 Steff's TI-Work Wellness Playlist (Spotify) — listen →";
    playlistNav.classList.toggle('return-link', onPlaylist);
  }

  document.getElementById('count').textContent = (current+1) + ' / ' + pages.length;
  document.getElementById('fill').style.width = ((current+1)/pages.length*100) + '%';
}

function handleNext(){
  if(current === pages.length - 1) jumpToStart();
  else turn(1);
}

function handlePlaylistNav(){
  if(current === pages.length - 1) jumpToStart();
  else jumpToMusic();
}

function turn(dir){
  const nextIndex = current + dir;
  if(nextIndex < 0 || nextIndex >= pages.length) return;
  els[current].classList.remove('current');
  els[current].classList.add(dir > 0 ? 'prev' : 'next');
  current = nextIndex;
  els[current].classList.remove('prev','next');
  els[current].classList.add('current');
  updateControls();
}

function jumpTo(index){
  if(index === current || index < 0 || index >= pages.length) return;
  const dir = index > current ? 1 : -1;
  els[current].classList.remove('current');
  els[current].classList.add(dir > 0 ? 'prev' : 'next');
  current = index;
  els[current].classList.remove('prev','next');
  els[current].classList.add('current');
  updateControls();
}

function jumpToMusic(){
  jumpTo(pages.length - 1);
}

function jumpToStart(){
  jumpTo(1);
}

function downloadNotes(){
  const entries = Object.keys(notesStore)
    .map(k => parseInt(k,10))
    .filter(k => notesStore[k] && notesStore[k].trim().length)
    .sort((a,b)=>a-b);
  if(!entries.length){
    alert('No notes written yet — jot something on any page first.');
    return;
  }
  let out = 'Trauma-Informed Workforce Wellness — My Notes\n';
  out += '(from the Field Guide, ' + new Date().toLocaleDateString() + ')\n\n';
  entries.forEach(i => {
    out += `— Page ${i+1} —\n${notesStore[i].trim()}\n\n`;
  });
  const blob = new Blob([out], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'my-field-guide-notes.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight') turn(1);
  if(e.key === 'ArrowLeft') turn(-1);
});

let touchX = null;
book.addEventListener('touchstart', (e)=>{ touchX = e.touches[0].clientX; });
book.addEventListener('touchend', (e)=>{
  if(touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx) > 40){ turn(dx < 0 ? 1 : -1); }
  touchX = null;
});
book.addEventListener('click', (e)=>{
  // Don't hijack clicks on real interactive elements (links, buttons, the
  // notes textarea) that happen to sit in the left/right tap zones —
  // otherwise a tap on a button can also register as a page turn.
  if(e.target.closest('a, button, textarea, input, label')) return;
  const rect = book.getBoundingClientRect();
  const x = e.clientX - rect.left;
  if(x > rect.width * 0.7) turn(1);
  else if(x < rect.width * 0.3) turn(-1);
});

render();

// --- Spotify playback control ---------------------------------------------
// Uses Spotify's official iFrame API so the playlist can be paused/resumed
// from ANY page, not just the one showing the player. Without this, the
// embed keeps playing invisibly after the person flips to another page,
// with no way to stop it short of finding the Spotify page again.
let spotifyController = null;

window.onSpotifyIframeApiReady = (IFrameAPI) => {
  const el = document.getElementById('spotify-embed-target');
  if(!el) return;
  const options = {
    uri: 'spotify:playlist:7djU80aWVF43XzsTTPw72N',
    width: '100%',
    height: '300'
  };
  IFrameAPI.createController(el, options, (controller) => {
    spotifyController = controller;
    const btn = document.getElementById('musicToggle');
    controller.addListener('ready', () => {
      btn.style.display = 'inline-block';
    });
    controller.addListener('playback_update', (e) => {
      btn.style.display = 'inline-block';
      btn.textContent = e.data.isPaused ? '▶ Play music' : '⏸ Pause music';
    });
  });
};

function toggleMusic(){
  if(spotifyController) spotifyController.togglePlay();
}

const spotifyApiScript = document.createElement('script');
spotifyApiScript.src = 'https://open.spotify.com/embed/iframe-api/v1';
spotifyApiScript.async = true;
document.body.appendChild(spotifyApiScript);

</script>
